name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pg_textsearch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./pg_textsearch
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pg_textsearch:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
