name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      postgresql: ${{ steps.filter.outputs.postgresql }}
      garage: ${{ steps.filter.outputs.garage }}
      versitygw: ${{ steps.filter.outputs.versitygw }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            postgresql:
              - 'postgresql/**'
            garage:
              - 'garage/**'
            versitygw:
              - 'versitygw/**'
            workflow:
              - '.github/workflows/**'

  pg_textsearch:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.postgresql == 'true' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./postgresql
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/postgresql:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

  garage:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.garage == 'true' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./garage
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/garage:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}

  versitygw:
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.versitygw == 'true' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./versitygw
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/versitygw:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
